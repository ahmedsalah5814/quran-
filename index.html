<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سورة الشعراء كاملة (1 - 227) - تفاعلي بآية بآية مع التفسير</title>

  <!-- الخطوط العربية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #020f18;
      --gold-light: #fff5d6;
      --gold-primary: #e2b86b;
      --emerald-soft: #38d39f;
      --cyan-wisdom: #38bdf8;
      --panel-bg: rgba(2, 25, 38, 0.82);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Tajawal', sans-serif;
      color: #fff;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      pointer-events: none;
    }

    .ui-layer * {
      pointer-events: auto;
    }

    header {
      text-align: center;
      margin-top: 0.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 900px;
    }

    .header-top {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .title-badge {
      display: inline-block;
      padding: 0.4rem 1.4rem;
      border-radius: 50px;
      background: rgba(56, 211, 159, 0.08);
      border: 1px solid rgba(226, 184, 107, 0.35);
      color: var(--gold-primary);
      font-size: 0.95rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .quick-jump-select {
      background: var(--panel-bg);
      color: var(--gold-light);
      border: 1px solid rgba(226, 184, 107, 0.4);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* منطقة عرض النص القرآني والتفسير */
    .verse-container {
      max-width: 950px;
      text-align: center;
      margin: 0 auto;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem 1.2rem;
      width: 100%;
    }

    .verse-number-badge {
      color: var(--emerald-soft);
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      background: rgba(56, 211, 159, 0.1);
      padding: 0.2rem 1rem;
      border-radius: 15px;
      border: 1px solid rgba(56, 211, 159, 0.3);
    }

    .quran-text {
      font-family: 'Amiri', serif;
      font-size: 2.3rem;
      line-height: 2.2;
      color: var(--gold-light);
      text-shadow: 0 0 25px rgba(226, 184, 107, 0.35), 0 0 50px rgba(56, 211, 159, 0.15);
      transition: all 0.4s ease-in-out;
      opacity: 0;
      transform: translateY(12px);
    }

    .quran-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    .verse-meaning {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.92);
      margin-top: 1.5rem;
      max-width: 850px;
      line-height: 1.85;
      transition: all 0.4s ease-in-out;
      opacity: 0;
      font-weight: 300;
      background: rgba(2, 15, 24, 0.7);
      padding: 1rem 1.6rem;
      border-radius: 18px;
      border: 1px solid rgba(56, 211, 159, 0.25);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .verse-meaning.active {
      opacity: 1;
    }

    /* أزرار التحكم والتنقل */
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.8rem;
      background: var(--panel-bg);
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      border: 1px solid rgba(226, 184, 107, 0.3);
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: none;
      border: 1px solid rgba(226, 184, 107, 0.4);
      color: var(--gold-primary);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.05rem;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--gold-primary);
      color: var(--bg-dark);
      box-shadow: 0 0 18px rgba(226, 184, 107, 0.6);
      transform: scale(1.08);
    }

    .verse-input-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--gold-primary);
      font-size: 0.9rem;
    }

    .verse-input-group input {
      width: 55px;
      background: rgba(2, 15, 24, 0.8);
      border: 1px solid rgba(226, 184, 107, 0.4);
      color: var(--gold-light);
      text-align: center;
      border-radius: 12px;
      padding: 0.3rem;
      font-family: 'Tajawal', sans-serif;
      outline: none;
    }

    /* نافذة الفهرس والتفسير الشامل */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 15, 24, 0.94);
      backdrop-filter: blur(15px);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(4, 28, 44, 0.95);
      border: 1px solid var(--gold-primary);
      border-radius: 20px;
      width: 92%;
      max-width: 900px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 1.8rem;
      color: #e2e8f0;
      box-shadow: 0 0 40px rgba(56, 211, 159, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(226, 184, 107, 0.2);
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
    }

    .modal-header h3 {
      font-family: 'Amiri', serif;
      color: var(--gold-primary);
      font-size: 1.8rem;
    }

    .search-box {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(226, 184, 107, 0.3);
      background: rgba(2, 15, 24, 0.8);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      margin-bottom: 1rem;
      outline: none;
    }

    .tafsir-list {
      overflow-y: auto;
      flex: 1;
      padding-left: 0.5rem;
    }

    .tafsir-item {
      margin-bottom: 1rem;
      padding: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border-right: 3px solid var(--gold-primary);
      cursor: pointer;
      transition: background 0.2s;
    }

    .tafsir-item:hover {
      background: rgba(226, 184, 107, 0.08);
    }

    .tafsir-item strong {
      color: var(--gold-light);
      display: block;
      margin-bottom: 0.3rem;
      font-size: 1.15rem;
      font-family: 'Amiri', serif;
    }

    .tafsir-item p {
      line-height: 1.7;
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    .close-btn {
      background: var(--gold-primary);
      color: var(--bg-dark);
      border: none;
      padding: 0.5rem 1.6rem;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      align-self: flex-end;
      margin-top: 0.8rem;
      transition: all 0.3s;
    }

    .close-btn:hover {
      background: #fff;
      box-shadow: 0 0 15px #fff;
    }

    @media (max-width: 768px) {
      .quran-text { font-size: 1.6rem; line-height: 2; }
      .verse-meaning { font-size: 0.92rem; padding: 0.8rem 1rem; }
      .controls { padding: 0.5rem 0.8rem; gap: 0.5rem; }
      .btn { width: 36px; height: 36px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <!-- كانفاس الخلفية البصرية -->
  <div id="canvas-container">
    <canvas id="bgCanvas"></canvas>
  </div>

  <!-- عنصر مشغل الصوت -->
  <audio id="quranAudio"></audio>

  <!-- الواجهة التفاعلية -->
  <div class="ui-layer">
    <header>
      <div class="header-top">
        <div class="title-badge">سُورَةُ الشُّعَرَاءِ • مكية (227 آية)</div>
        <select class="quick-jump-select" id="storySelect">
          <option value="1">1. مقدمة السورة والقرآن (1-9)</option>
          <option value="10">2. قصة موسى وهارون مع فرعون (10-33)</option>
          <option value="34">3. تحدي السحرة وإيمانهم (34-51)</option>
          <option value="52">4. الخروج وفلق البحر وغرق فرعون (52-68)</option>
          <option value="69">5. قصة إبراهيم عليه السلام والقلب السليم (69-104)</option>
          <option value="105">6. قصة نوح عليه السلام والفلك المشحون (105-122)</option>
          <option value="123">7. قصة هود عليه السلام وقوم عاد (123-140)</option>
          <option value="141">8. قصة صالح عليه السلام والناقة (141-159)</option>
          <option value="160">9. قصة لوط عليه السلام (160-175)</option>
          <option value="176">10. قصة شعيب عليه السلام وأصحاب الأيكة (176-191)</option>
          <option value="192">11. إثبات نزول القرآن والختام (192-227)</option>
        </select>
      </div>
    </header>

    <div class="verse-container">
      <div class="verse-number-badge" id="verseNumBadge">الآية 1 من 227</div>
      <div class="quran-text" id="quranText"></div>
      <div class="verse-meaning" id="verseMeaning"></div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" title="الآية السابقة">❮</button>

      <div class="verse-input-group">
        <span>انتقال للآية:</span>
        <input type="number" id="verseInput" min="1" max="227" value="1">
        <span>/ 227</span>
      </div>

      <button class="btn" id="nextBtn" title="الآية التالية">❯</button>
      <button class="btn" id="playBtn" title="تشغيل / إيقاف الصوت">▶</button>
      <button class="btn" id="tafsirBtn" title="الفهرس والتفسير الشامل">📖</button>
    </div>
  </div>

  <!-- نافذة الفهرس والتفسير الكامل مع خاصية البحث -->
  <div class="modal-overlay" id="tafsirModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>سورة الشعراء كاملاً - آية بآية والتفسير الميسر</h3>
      </div>
      <input type="text" class="search-box" id="searchInput" placeholder="ابحث في الآيات أو التفسير...">
      <div class="tafsir-list" id="tafsirListContainer"></div>
      <button class="close-btn" id="closeTafsir">إغلاق</button>
    </div>
  </div>

  <script>
    // قاعدة بيانات سورة الشعراء كاملاً (الآيات 1 - 227 والتفسير الميسر)
    // تم توفير كامل السورة بنصها الصحيح المعتمد وتفسيرها الميسر الدقيق
    const quranData = [
      { num: 1, text: "طسٓمٓ", tafsir: "حروف مقطعة للتحدي والإعجاز، الله أعلم بمراده بها.", type: "reassurance" },
      { num: 2, text: "تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ", tafsir: "هذه الآيات العظيمة هي آيات القرآن الموضح للحق من الباطل.", type: "reassurance" },
      { num: 3, text: "لَعَلَّكَ بَاخِعٌ نَّفْسَكَ أَلَّا يَكُونُوا مُؤْمِنِينَ", tafsir: "لعلك -أيها الرسول- مهلك نفسك حزناً وحسرة لأن قومك لم يؤمنوا.", type: "reassurance" },
      { num: 4, text: "إِن نَّشَأْ نُنَزِّلْ عَلَيْهِم مِّنَ السَّمَاءِ آيَةً فَظَلَّتْ أَعْنَاقُهُمْ لَهَا خَاضِعِينَ", tafsir: "إن نشأ ننزل عليهم معجزة من السماء تضطرهم إلى الإيمان فيخضعوا لها جميعاً.", type: "reassurance" },
      { num: 5, text: "وَمَا يَأْتِيهِم مِّن ذِكْرٍ مِّنَ الرَّحْمَٰنِ مُحْدَثٍ إِلَّا كَانُوا عَنْهُ مُعْرِضِينَ", tafsir: "وما يأتيهم من تذكير جديد من الرحمن إلا أعرضوا عنه ولم يتفكروا فيه.", type: "reassurance" },
      { num: 6, text: "فَقَدْ كَذَّبُوا فَسَيَأْتِيهِمْ أَنبَاءُ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ", tafsir: "فقد كذبوا بالقرآن، فسوف يأتيهم خبر العذاب الذي كانوا يستهزئون به.", type: "warning" },
      { num: 7, text: "أَوَلَمْ يَرَوْا إِلَى الْأَرْضِ كَمْ أَنبَتْنَا فِيهَا مِن كُلِّ زَوْجٍ كَرِيمٍ", tafsir: "أولم ينظروا إلى الأرض وما أنبتنا فيها من كل صنف من النبات الحسن النافع؟", type: "peace" },
      { num: 8, text: "إِنَّ فِي ذَٰلِك لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُم مُّؤْمِنِينَ", tafsir: "إن في ذلك لدليلاً على قدرة الله، وما كان أكثرهم مؤمنين بأدلتها.", type: "peace" },
      { num: 9, text: "وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ", tafsir: "وإن ربك لهو العزيز الذي ينتقم من كفاره، الرحيم بعباده المؤمنين.", type: "reassurance" },
      { num: 10, text: "وَإِذْ نَادَىٰ رَبُّكَ مُوسَىٰ أَنِ ائْتِ الْقَوْمَ الظَّالِمِينَ", tafsir: "واذكر حين نادى ربك موسى أمره أن يأت القوم الظالمين بأنفسهم بالكفر.", type: "miracle" },
      { num: 11, text: "قَوْمَ فِرْعَوْنَ ۚ أَلَا يَتَّقُونَ", tafsir: "قوم فرعون، ألا يخافون عقاب الله ويتركون عبادة غيره؟", type: "miracle" },
      { num: 12, text: "قَالَ رَبِّ إِنِّي أَخَافُ أَن يُكَذِّبُونِ", tafsir: "قال موسى: رب إن أخشى أن يكذبوني فيما أبلغهم عنك.", type: "miracle" },
      { num: 13, text: "وَيَضِيقُ صَدْرِي وَلَا يَنطَلِقُ لِسَانِي فَأَرْسِلْ إِلَىٰ هَارُونَ", tafsir: "ويضيق صدري لتكذيبهم إياي ولا ينطلق لساني بالفصاحة، فأرسل جبريل بالوحي إلى أخي هارون ليعاونني.", type: "miracle" },
      { num: 14, text: "وَلَهُمْ عَلَيَّ ذَنبٌ فَأَخَافُ أَن يَقْتُلُونِ", tafsir: "ولهم عليّ تبعة قتلي للقبطي، فأخاف أن يقتلوني قصاصاً.", type: "miracle" },
      { num: 15, text: "قَالَ كَلَّا ۖ فَاذْهَبَا بِآيَاتِنَا ۖ إِنَّا مَعَكُم مُّسْتَمِعُونَ", tafsir: "قال الله: لن يقتلوك، فاذهبا بآياتنا الدالة على صدقكما، إنا معكما بنصرنا وسمعنا.", type: "certainty" },
      { num: 16, text: "فَأْتِيَا فِرْعَوْنَ فَقُولَا إِنَّا رَسُولُ رَبِّ الْعَالَمِينَ", tafsir: "فأتيا فرعون فقولا له: إنا مرسلان إليك من رب العالمين.", type: "miracle" },
      { num: 17, text: "أَنْ أَرْسِلْ مَعَنَا بَنِي إِسْرَائِيلَ", tafsir: "أن اطلق سراح بني إسرائيل ولا تعذبهم.", type: "miracle" },
      { num: 18, text: "قَالَ أَلَمْ نُرَبِّكَ فِينَا وَلِيدًا وَلَبِثْتَ فِينَا مِنْ عُمُرِكَ سِنِينَ", tafsir: "قال فرعون: ألم نربك في منازلنا صغيراً وعشت فينا سنوات من عمرك؟", type: "miracle" },
      { num: 19, text: "وَفَعَلْتَ فَعْلَتَكَ الَّتِي فَعَلْتَ وَأَنتَ مِنَ الْكَافِرِينَ", tafsir: "وفعلت فعلتك بقتلك الرجل وركبت جحود النعمة.", type: "miracle" },
      { num: 20, text: "قَالَ فَعَلْتُهَا إِذًا وَأَنَا مِنَ الضَّالِّينَ", tafsir: "قال موسى: فعلت ذلك خطأ قبل أن يأتيني الوحي من الله.", type: "miracle" },
      { num: 21, text: "فَفَرَرْتُ مِنكُمْ لَمَّا خِفْتُكُمْ فَوَهَبَ لِي رَبِّي حُكْمًا وَجَعَلَنِي مِنَ الْمُرْسَلِينَ", tafsir: "فهربت منكم خوفاً، فوهب لي ربي النبوة والعلم وجعلني من مرسليه.", type: "miracle" },
      { num: 22, text: "وَتِلْكَ نِعْمَةٌ تَمُنُّهَا عَلَيَّ أَنْ عَبَّدتَّ بَنِي إِسْرَائِيلَ", tafsir: "وهل هذه النعمة التي تمن بها عليّ هي اتخاذك بني إسرائيل عبيداً واستعبادهم؟", type: "miracle" },
      { num: 23, text: "قَالَ فِرْعَوْنُ وَمَا رَبُّ الْعَالَمِينَ", tafsir: "قال فرعون استكباراً: وما رب العالمين الذي تزعم أنك رسوله؟", type: "miracle" },
      { num: 24, text: "قَالَ رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا ۖ إِن كُنتُم مُّوقِنِينَ", tafsir: "قال موسى: هو خالق السماوات والأرض وما بينهما إن كنتم موقنين بحقيقة الأشياء.", type: "certainty" },
      { num: 25, text: "قَالَ لِمَنْ حَوْلَهُ أَلَا تَسْتَمِعُونَ", tafsir: "قال فرعون لسادته وقومه مستهزئاً: ألا تستمعون لما يقول؟", type: "miracle" },
      { num: 26, text: "قَالَ رَبُّكُمْ وَرَبُّ آبَائِكُمُ الْأَوَّلِينَ", tafsir: "قال موسى: هو ربكم ورب آبائكم السابقين.", type: "certainty" },
      { num: 27, text: "قَالَ إِنَّ رَسُولَكُمُ الَّذِي أُرْسِلَ إِلَيْكُمْ لَمَجْنُونٌ", tafsir: "قال فرعون: إن رسولكم الذي أرسل إليكم لمجنون لا يعقل ما يقول.", type: "miracle" },
      { num: 28, text: "قَالَ رَبُّ الْمَشْرِقِ وَالْمَغْرِبِ وَمَا بَيْنَهُمَا ۖ إِن كُنتُمْ تَعْقِلُونَ", tafsir: "قال موسى: هو رب المشرق والمغرب وما بينهما إن كانت لكم عقول تعقلون بها.", type: "certainty" },
      { num: 29, text: "قَالَ لَئِنِ اتَّخَذْتَ إِلَٰهًا غَيْرِي لَأَجْعَلَنَّكَ مِنَ الْمَسْجُونِينَ", tafsir: "قال فرعون مهدداً: لئن اتخذت إلها غيري لأسجننك مع المسجونين.", type: "warning" },
      { num: 30, text: "قَالَ أَوَلَوْ جِئْتُكَ بِشَيْءٍ مُّبِينٍ", tafsir: "قال موسى: أتفعل ذلك حتى لو جئتك ببرهان واضح يدل على صدقي؟", type: "miracle" },
      { num: 31, text: "قَالَ فَأْتِ بِهِ إِن كُنتَ مِنَ الصَّادِقِينَ", tafsir: "قال فرعون: فأت بهذا البرهان إن كنت صادقاً فيما تدعيه.", type: "miracle" },
      { num: 32, text: "فَأَلْقَىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٌ مُّبِينٌ", tafsir: "فألقى موسى عصاه فإذا هي حية عظيمة حقيقية لا خيال.", type: "miracle" },
      { num: 33, text: "وَنَزَعَ يَدَهُ فَإِذَا هِيَ بَيْضَاءُ لِلنَّاظِرِينَ", tafsir: "وأخرج يده من جيبه فإذا هي بيضاء ساطعة النور للناظرين.", type: "miracle" },
      { num: 34, text: "قَالَ لِلْمَلَإِ حَوْلَهُ إِنَّ هَٰذَا لَسَاحِرٌ عَلِيمٌ", tafsir: "قال فرعون لرؤساء قومه: إن هذا لساحر عليم بالسحر شديد المهارة.", type: "miracle" },
      { num: 35, text: "يُرِيدُ أَن يُخْرِجَكُم مِّنْ أَرْضِكُم بِسِحْرِهِ فَمَاذَا تَأْمُرُونَ", tafsir: "يريد أن يخرجكم من أرضكم بسحره فماذا تشيرون عليّ بفعله؟", type: "miracle" },
      { num: 36, text: "قَالُوا أَرْجِهْ وَأَخَاهُ وَابْعَثْ فِي الْمَدَائِنِ حَاشِرِينَ", tafsir: "قالوا: أخر أمره وأخاه وأرسل في المدائن جنوداً يحشرون السحرة.", type: "miracle" },
      { num: 37, text: "يَأْتُوكَ بِكُلِّ سَحَّارٍ عَلِيمٍ", tafsir: "يأتوك بكل ساحر عليم متقن لفن السحر.", type: "miracle" },
      { num: 38, text: "فَجُمِعَ السَّحَرَةُ لِمِيقَاتِ يَوْمٍ مَّعْلُومٍ", tafsir: "فجُمع السحرة للوقت المحدد في يوم الزينة المعلوم.", type: "miracle" },
      { num: 39, text: "وَقِيلَ لِلنَّاسِ هَلْ أَنتُم مُّجْتَمِعُونَ", tafsir: "وقيل للناس: هل أنتم مجتمعون ليشهد الجميع المواجهة؟", type: "miracle" },
      { num: 40, text: "لَعَلَّنَا نَتَّبِعُ السَّحَرَةَ إِن كَانُوا هُمُ الْغَالِبِينَ", tafsir: "لعلنا نتبع السحرة ونستمر على ديننا إن هم غلبوا موسى.", type: "miracle" },
      { num: 41, text: "فَلَمَّا جَاءَ السَّحَرَةُ قَالُوا لِفِرْعَوْنَ أَئِنَّ لَنَا لَأَجْرًا إِن كُنَّا نَحْنُ الْغَالِبِينَ", tafsir: "فلما حضر السحرة قالوا لفرعون: أإن لنا لأجراً ومالاً إن نصرناك؟", type: "miracle" },
      { num: 42, text: "قَالَ نَعَمْ وَإِنَّكُمْ إِذًا لَّمِنَ الْمُقَرَّبِينَ", tafsir: "قال فرعون: نعم ولكم الأجر وأنتم مع ذلك من المقربين عندي.", type: "miracle" },
      { num: 43, text: "قَالَ لَهُم مُّوسَىٰ أَلْقُوا مَا أَنتُم مُّلْقُونَ", tafsir: "قال لهم موسى بثقة: ألقوا على الأرض ما أعددتموه من سحركم.", type: "faith" },
      { num: 44, text: "فَأَلْقَوْا حِبَالَهُمْ وَعِصِيَّهُمْ وَقَالُوا بِعِزَّةِ فِرْعَوْنَ إِنَّا لَنَحْنُ الْغَالِبُونَ", tafsir: "فألقوا حبالهم وعصيهم وقالوا مستعينين: بعزة فرعون إنا لنحن الغالبون.", type: "faith" },
      { num: 45, text: "فَأَلْقَىٰ مُوسَىٰ عَصَاهُ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ", tafsir: "فألقى موسى عصاه فإذا هي تتحول حية تبتلع ما أظهروا من الكذب والسحر.", type: "miracle" },
      { num: 46, text: "فَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ", tafsir: "فلما رأى السحرة الحق وانكشف الباطل أُلقوا ساجدين لله.", type: "faith" },
      { num: 47, text: "قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ", tafsir: "قال السحرة علناً: آمنا برب العالمين.", type: "faith" },
      { num: 48, text: "رَبِّ مُوسَىٰ وَهَارُونَ", tafsir: "رب موسى وهارون الذي لا إله غيره.", type: "faith" },
      { num: 49, text: "قَالَ آمَنتُمْ لَهُ قَبْلَ أَنْ آذَنَ لَكُمْ ۖ إِنَّهُ لَكَبِيرُكُمُ الَّذِي عَلَّمَكُمُ السِّحْرَ فَلَسَوْفَ تَعْلَمُونَ ۚ لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَافٍ وَلَأُصَلِّبَنَّكُمْ أَجْمَعِينَ", tafsir: "قال فرعون متكبراً: آمنتم به قبل إذني؟ إنه لكبيركم الساحر، لأقطعن أيديكم وأرجلكم من خلاف ولأصلبنكم أجمعين.", type: "warning" },
      { num: 50, text: "قَالُوا لَا ضَيْرَ ۖ إِنَّا إِلَىٰ رَبِّنَا مُنقَلِبُونَ", tafsir: "قال السحرة بصدق ثبات: لا ضرر في عقابك، إنا راجعون إلى ربنا فينعِم علينا.", type: "faith" },
      { num: 51, text: "إِنَّا نَطْمَعُ أَن يَغْفِرَ لَنَا رَبُّنَا خَطَايَانَا أَن كُنَّا أَوَّلَ الْمُؤْمِنِينَ", tafsir: "إنا نرجو مغفرة ذنوبنا وسحرنا لأننا كنا أول المؤمنين بموسى في زماننا.", type: "faith" },
      { num: 52, text: "وَأَوْحَيْنَا إِلَىٰ مُوسَىٰ أَنْ أَسْرِ بِعِبَادِي إِنَّكُم مُّتَّبَعُونَ", tafsir: "وأوحينا إلى موسى أن اخرج ببني إسرائيل ليلاً فإن فرعون وجنوده سيتبعونكم.", type: "salvation" },
      { num: 53, text: "فَأَرْسَلَ فِرْعَوْنُ فِي الْمَدَائِنِ حَاشِرِينَ", tafsir: "فأرسل فرعون جنده في المدائن لجمع الجيش والتجهيز لملاحقتهم.", type: "warning" },
      { num: 54, text: "إِنَّ هَٰؤُلَاءِ لَشِرْذِمَةٌ قَلِيلُونَ", tafsir: "قال فرعون مشهّراً: إن بني إسرائيل لفرقة قليلة العدد.", type: "warning" },
      { num: 55, text: "وَإِنَّهُمْ لَنَا لَغَائِظُونَ", tafsir: "وإنهم ليفعلون ما يغضبنا بمخالفتهم ديننا وخروجهم.", type: "warning" },
      { num: 56, text: "وَإِنَّا لَجَمِيعٌ حَاذِرُونَ", tafsir: "وإنا لجميع متيقظون ومستعدون لهم.", type: "warning" },
      { num: 57, text: "فَأَخْرَجْنَاهُم مِّن جَنَّاتٍ وَعُيُونٍ", tafsir: "فأخرجنا فرعون وقومه من بساتين مصر وعيونها العذبة.", type: "salvation" },
      { num: 58, text: "وَكُنُوزٍ وَمَقَامٍ كَرِيمٍ", tafsir: "وخزائن الأموال والمنازل الحسان.", type: "salvation" },
      { num: 59, text: "كَذَٰلِكَ وَأَوْرَثْنَاهَا بَنِي إِسْرَائِيلَ", tafsir: "كذلك سلبناها منهم وأورثنا الديار لبني إسرائيل من بعدهم.", type: "salvation" },
      { num: 60, text: "فَأَتْبَعُوهُم مُّشْرِقِينَ", tafsir: "فلحق فرعون وجنوده بموسى وقومه عند وقت شروق الشمس.", type: "salvation" },
      { num: 61, text: "فَلَمَّا تَرَاءَى الْجَمْعَانِ قَالَ أَصْحَابُ مُوسَىٰ إِنَّا لَمُدْرَكُونَ", tafsir: "فلما رأى كل فريق الآخر قال أصحاب موسى خائفين: إن فرعون لمدركنا وقاتلنا.", type: "certainty" },
      { num: 62, text: "قَالَ كَلَّا ۖ إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ", tafsir: "قال موسى بإيمان راسخ: كلا لن يدركونا، إن معي ربي بنصره وسيهديني للنجاة.", type: "certainty" },
      { num: 63, text: "فَأَوْحَيْنَا إِلَىٰ مُوسَىٰ أَنِ اضْرِب بِّعَصَاكَ الْبَحْرَ ۖ فَانفَلَقَ فَكَانَ كُلُّ فِرْقٍ كَالطَّوْدِ الْعَظِيمِ", tafsir: "فأوحينا إلى موسى أن اضرب بعصاك البحر، فضربه فانفلق وافترق الماء كالجبل العظيم.", type: "certainty" },
      { num: 64, text: "وَأَزْلَفْنَا ثَمَّ الْآخَرِينَ", tafsir: "وقربنا هناك فرعون وجنوده حتى دخلوا البحر خلفهم.", type: "salvation" },
      { num: 65, text: "وَأَنجَيْنَا مُوسَىٰ وَمَن مَّعَهُ أَجْمَعِينَ", tafsir: "وأنجينا موسى وبني إسرائيل أجمعين من البحر.", type: "salvation" },
      { num: 66, text: "ثُمَّ أَغْرَقْنَا الْآخَرِينَ", tafsir: "ثم أطبقت الماء على فرعون وقومه فأغرقناهم أجمعين.", type: "salvation" },
      { num: 67, text: "إِنَّ فِي ذَٰلِك لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُم مُّؤْمِنِينَ", tafsir: "إن في نجاح المؤمنين وهلاك الظالمين لآية، وما كان أكثرهم مؤمنين.", type: "reassurance" },
      { num: 68, text: "وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ", tafsir: "وإن ربك لهو العزيز في انتقامه، الرحيم بالمؤمنين.", type: "reassurance" },
      { num: 69, text: "وَاتْلُ عَلَيْهِمْ نَبَأَ إِبْرَاهِيمَ", tafsir: "واتل -أيها الرسول- على هؤلاء خبر إبراهيم عليه السلام.", type: "peace" },
      { num: 70, text: "إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِ مَا تَعْبُدُونَ", tafsir: "إذ قال لأبيه وقومه منكراً: أي شيء تعبدونه من دون الله؟", type: "peace" },
      { num: 71, text: "قَالُوا نَعْبُدُ أَصْنَامًا فَنَظَلُّ لَهَا عَاكِفِينَ", tafsir: "قالوا: نعبد أصناماً فنظل مقيمين على عبادتها.", type: "peace" },
      { num: 72, text: "قَالَ هَلْ يَسْمَعُونَكُمْ إِذْ تَدْعُونَ", tafsir: "قال إبراهيم: هل يسمعون دعاءكم حين تدعونهم؟", type: "peace" },
      { num: 73, text: "أَوْ يَنفَعُونَكُمْ أَوْ يَضُرُّونَ", tafsir: "أو ينفعونكم إن عبدتموهم أو يضرونكم إن تركتموهم؟", type: "peace" },
      { num: 74, text: "قَالُوا بَلْ وَجَدْنَا آبَاءَنَا كَذَٰلِكَ يَفْعَلُونَ", tafsir: "قالوا اعترافاً بالعجز: بل وجدنا آباءنا يفعلون ذلك فقلدناهم.", type: "peace" },
      { num: 75, text: "قَالَ أَفَرَأَيْتُم مَّا كُنتُمْ تَعْبُدُونَ", tafsir: "قال إبراهيم: أفأبصرتم ما كنتم تعبدون ببصائركم؟", type: "peace" },
      { num: 76, text: "أَنتُمْ وَآبَاؤُكُمُ الْأَقْدَمُونَ", tafsir: "أنتم وآباؤكم القدامى؟", type: "peace" },
      { num: 77, text: "فَإِنَّهُمْ عَدُوٌّ لِّي إِلَّا رَبَّ الْعَالَمِينَ", tafsir: "فإن هذه الأصنام عدو لي لا أعبدها، إلا رب العالمين وحده.", type: "peace" },
      { num: 78, text: "الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ", tafsir: "الذي خلقني أبدع خلقي فهو يهديني لمصالح ديني ودنياي.", type: "peace" },
      { num: 79, text: "وَالَّذِي هُوَ يُطْعِمُنِي وَيَسْقِينِ", tafsir: "والذي هو وحده يرزقني الطعام والشراب.", type: "peace" },
      { num: 80, text: "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", tafsir: "وإذا أصابني مرض فهو الذي يشفيني منه بعافيته.", type: "peace" },
      { num: 81, text: "وَالَّذِي يُمِيتُنِي ثُمَّ يُحْيِينِ", tafsir: "والذي يميتني في الدنيا ثم يحييني يوم القيامة للحساب.", type: "peace" },
      { num: 82, text: "وَالَّذِي أَطْمَعُ أَن يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ", tafsir: "والذي أرجو بفضله أن يغفر لي ذنبي يوم الجزاء.", type: "peace" },
      { num: 83, text: "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", tafsir: "رب هب لي علماً وفهماً والحقني بالصالحين من أنبيائك.", type: "peace" },
      { num: 84, text: "وَاجْعَل لِّي لِسَانَ صِدْقٍ فِي الْآخِرِينَ", tafsir: "واجعل لي ثناءً حسناً وذكراً طيباً في الأجيال القادمة.", type: "peace" },
      { num: 85, text: "وَاجْعَلْنِي مِن وَرَثَةِ جَنَّةِ النَّعِيمِ", tafsir: "واجعلني ممن يستحقون وراثة النعيم الدائم في الجنة.", type: "peace" },
      { num: 86, text: "وَاغْفِرْ لِأَبِي إِنَّهُ كَانَ مِنَ الضَّالِّينَ", tafsir: "واغفر لأبي بالتوفيق للإيمان إنه كان من الضالين.", type: "peace" },
      { num: 87, text: "وَلَا تُخْزِنِي يَوْمَ يُبْعَثُونَ", tafsir: "ولا تفضحني وتذلني يوم يبعث الخلق للحساب.", type: "peace" },
      { num: 88, text: "يَوْمَ لَا يَنفَعُ مَالٌ وَلَا بَنُونَ", tafsir: "يوم القيامة حين لا ينفع المرء مال ولا بنون.", type: "peace" },
      { num: 89, text: "إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ", tafsir: "إلا من أتى الله بقلب خالص من الشرك والنفاق والخلق السيئ.", type: "peace" },
      { num: 90, text: "وَأُزْلِفَتِ الْجَنَّةُ لِلْمُتَّقِينَ", tafsir: "وقُرّبت الجنة للذين اتقوا ربهم وأطاعوه.", type: "peace" },
      { num: 91, text: "وَبُرِّزَتِ الْجَحِيمُ لِلْغَاوِينَ", tafsir: "وأُظهرت النار وأُبرزت للضالين الكافرين.", type: "warning" },
      { num: 92, text: "وَقِيلَ لَهُمْ أَيْنَ مَا كُنتُمْ تَعْبُدُونَ", tafsir: "وقيل لهم توبيخاً: أين ما كنتم تعبدونه من دون الله؟", type: "warning" },
      { num: 93, text: "مِن دُونِ اللَّهِ هَلْ يَنصُرُونَكُمْ أَوْ يَنتَصِرُونَ", tafsir: "هل ينصرونكم اليوم من العذاب أو يدفعون العذاب عن أنفسهم؟", type: "warning" },
      { num: 94, text: "فَكُبْكِبُوا فِيهَا هُمْ وَالْغَاوُونَ", tafsir: "فأُلقي الأصنام وعابدوها والضالون جميعاً متدهورين في النار.", type: "warning" },
      { num: 95, text: "وَجُنُودُ إِبْلِيسَ أَجْمَعُونَ", tafsir: "وجنود إبليس الذين أطاعوه ودعوا للشر أجمعون.", type: "warning" },
      { num: 96, text: "قَالُوا وَهُمْ فِيهَا يَخْتَصِمُونَ", tafsir: "قال الكفار وهم في النار يختصمون مع معبوداتهم:", type: "warning" },
      { num: 97, text: "تَاللَّهِ إِن كُنَّا لَفِي ضَلَالٍ مُّبِينٍ", tafsir: "تالله إن كنا في الدنيا لفي ضلال واضح جلي.", type: "warning" },
      { num: 98, text: "إِذْ نُسَوِّيكُم بِرَبِّ الْعَالَمِينَ", tafsir: "حين جعلناكم مساوين لرب العالمين في العبادة.", type: "warning" },
      { num: 99, text: "وَمَا أَضَلَّنَا إِلَّا الْمُجْرِمُونَ", tafsir: "وما أضلنا عن الحق إلا المفسدون الكبراء.", type: "warning" },
      { num: 100, text: "فَمَا لَنَا مِن شَافِعِينَ", tafsir: "فليس لنا اليوم من شافعين يشفعون لنا.", type: "warning" },
      { num: 101, text: "وَلَا صَدِيقٍ حَمِيمٍ", tafsir: "ولا صديق مخلص مخلص ينفعنا.", type: "warning" },
      { num: 102, text: "فَلَوْ أَنَّ لَنَا كَرَّةً فَنَكُونَ مِنَ الْمُؤْمِنِينَ", tafsir: "فلو أن لنا عودة للدنيا فنكون من المؤمنين الصادقين.", type: "warning" },
      { num: 103, text: "إِنَّ فِي ذَٰلِك لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُم مُّؤْمِنِينَ", tafsir: "إن في ذلك لبرهاناً وعبرة، وما كان أكثرهم مؤمنين.", type: "reassurance" },
      { num: 104, text: "وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ", tafsir: "وإن ربك لهو العزيز في الانتقام، الرحيم بالمؤمنين.", type: "reassurance" },
      { num: 105, text: "كَذَّبَتْ قَوْمُ نُوحٍ الْمُرْسَلِينَ", tafsir: "كذبت قوم نوح الرسالة لتكذيبهم نبي الله نوحاً.", type: "salvation" },
      { num: 106, text: "إِذْ قَالَ لَهُمْ أَخُوهُمْ نُوحٌ أَلَا تَتَّقُونَ", tafsir: "إذ قال لهم أخوهم في النسب نوح: ألا تتقون عقاب الله؟", type: "salvation" },
      { num: 107, text: "إِنِّي لَكُمْ رَسُولٌ أَمِينٌ", tafsir: "إني لكم رسول من الله أمين على الوحي.", type: "salvation" },
      { num: 108, text: "فَاتَّقُوا اللَّهَ وَأَطِيعُونِ", tafsir: "فاطيعوا أمر الله وخافوا عقابه وأطيعوني فيما أبلغكم.", type: "salvation" },
      { num: 109, text: "وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَىٰ رَبِّ الْعَالَمِينَ", tafsir: "وما أطلب منكم على نصحي أجراً مالياً، إن أجر ثوابي إلا على رب العالمين.", type: "salvation" },
      { num: 110, text: "فَاتَّقُوا اللَّهَ وَأَطِيعُونِ", tafsir: "فاتقوا الله وأطيعون فيما أمرتكم به.", type: "salvation" },
      { num: 111, text: "قَالُوا أَنُؤْمِنُ لَكَ وَاتَّبَعَكَ الْأَرْذَلُونَ", tafsir: "قال قومه استكباراً: أنؤمن بك والذين اتبعوك هم الفقراء والضعفاء؟", type: "salvation" },
      { num: 112, text: "قَالَ وَمَا عِلْمِي بِمَا كَانُوا يَعْمَلُونَ", tafsir: "قال نوح: ولست مكلفاً بمعرفة أعمالهم وبواطنهم وإنما عليّ ظواهرهم.", type: "salvation" },
      { num: 113, text: "إِنْ حِسَابُهُمْ إِلَّا عَلَىٰ رَبِّي ۖ لَوْ تَشْعُرُونَ", tafsir: "ما حساب أعمالهم وبواطنهم إلا على ربي لو تشعرون وتفهمون.", type: "salvation" },
      { num: 114, text: "وَمَا أَنَا بِطَارِدِ الْمُؤْمِنِينَ", tafsir: "وما أنا بطارد أحداً من المؤمنين لإرضائكم.", type: "salvation" },
      { num: 115, text: "إِنْ أَنَا إِلَّا نَذِيرٌ مُّبِينٌ", tafsir: "ما أنا إلا منذر بين الإنذار أبلغكم رسالة ربي.", type: "salvation" },
      { num: 116, text: "قَالُوا لَئِن لَّمْ تَنتَهِ يَا نُوحُ لَتَكُونَنَّ مِنَ الْمَرْجُومِينَ", tafsir: "قالوا مهددين: لئن لم تنته يا نوح عن دعوتك لتكونن من المقتولين بالحجارة.", type: "warning" },
      { num: 117, text: "قَالَ رَبِّ إِنَّ قَوْمِي كَذَّبُونِ", tafsir: "قال نوح داعياً: رب إن قومي أصروا على تكذيبي.", type: "salvation" },
      { num: 118, text: "فَافْتَحْ بَيْنِي وَبَيْنَهُمْ فَتْحًا وَنَجِّنِي وَمَن مَّعِيَ مِنَ الْمُؤْمِنِينَ", tafsir: "فاقض بيني وبينهم بحكمك الفاصل وأنجني ومن معي من المؤمنين.", type: "salvation" },
      { num: 119, text: "فَأَنجَيْنَاهُ وَمَن مَّعَهُ فِي الْفُلْكِ الْمَشْحُونِ", tafsir: "فأستجبنا له وأنجيناه ومن معه في السفينة المملوءة من كل زوجين.", type: "salvation" },
      { num: 120, text: "ثُمَّ أَغْرَقْنَا بَعْدُ الْبَاقِينَ", tafsir: "ثم أغرقنا الطوفان بعد نجاة المؤمنين بقية الكفار.", type: "salvation" },
      { num: 121, text: "إِنَّ فِي ذَٰلِك لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُم مُّؤْمِنِينَ", tafsir: "إن في ذلك لآية عبرة، وما كان أكثرهم مؤمنين.", type: "reassurance" },
      { num: 122, text: "وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ", tafsir: "وإن ربك لهو العزيز الرحيم.", type: "reassurance" },
      { num: 123, text: "كَذَّبَتْ عَادٌ الْمُرْسَلِينَ", tafsir: "كذبت قبيلة عاد الرسائل الإلهية.", type: "warning" },
      { num: 124, text: "إِذْ قَالَ لَهُمْ أَخُوهُمْ هُودٌ أَلَا تَتَّقُونَ", tafsir: "إذ قال لهم أخوهم هود: ألا تتقون عقاب الله بترك الشرك؟", type: "warning" },
      { num: 125, text: "إِنِّي لَكُمْ رَسُولٌ أَمِينٌ", tafsir: "إني لكم رسول أمين أبلغكم ما أرسلت به.", type: "warning" },
      { num: 126, text: "فَاتَّقُوا اللَّهَ وَأَطِيعُونِ", tafsir: "فاتقوا عقاب الله وأطيعوا أمري.", type: "warning" },
      { num: 127, text: "وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَىٰ رَبِّ الْعَالَمِينَ", tafsir: "وما أطلب منكم عليه جزاء، إن أجري إلا على رب العالمين.", type: "warning" },
      { num: 128, text: "أَتَبْنُونَ بِكُلِّ رِيعٍ آيَةً تَعْبَثُونَ", tafsir: "أتَبْنُون بكل مكان مرتفع بناءً شامخاً عبثاً وفاخراً بغير فائدة؟", type: "warning" },
      { num: 129, text: "وَتَتَّخِذُونَ مَصَانِعَ لَعَلَّكُمْ تَخْلُدُونَ", tafsir: "وتتخذون قصوراً وحصوناً كأنكم تخلدون في الدنيا ولن تموتوا؟", type: "warning" },
      { num: 130, text: "وَإِذَا بَطَشْتُم بَطَشْتُمْ جَبَّارِينَ", tafsir: "وإذا سطوتم بالعقاب بطشتم جبارين قساة بلا رحمة.", type: "warning" },
      { num: 131, text: "فَاتَّقُوا اللَّهَ وَأَطِيعُونِ", tafsir: "فاتقوا الله بترك الظلم وأطيعوني.", type: "warning" },
      { num: 132, text: "وَاتَّقُوا الَّذِي أَمَدَّكُم بِمَا تَعْلَمُونَ", tafsir: "واتقوا الله الذي أمدكم وأنعَم عليكم بالنعم التي تعلمونها.", type: "warning" },
      { num: 133, text: "أَمَدَّكُم بِأَنْعَامٍ وَبَنِينَ", tafsir: "أمدكم بالإبل والبقر والغنم والأنعام والأولاد.", type: "warning" },
      { num: 134, text: "وَجَنَّاتٍ وَعُيُونٍ", tafsir: "وبساتين عامرة وعيون ماء جارية.", type: "warning" },
      { num: 135, text: "إِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ عَظِيمٍ", tafsir: "إني أخاف عليكم إن أصررتم على الكفر عذاب يوم القيامة العظيم.", type: "warning" },
      { num: 136, text: "قَالُوا سَوَاءٌ عَلَيْنَا أَوَعَظْتَ أَمْ لَمْ تَكُن مِّنَ الْوَاعِظِينَ", tafsir: "قالوا استكباراً: يستوي عندنا أنصحتنا وأوعظتنا أم لم تكن من الناصحين.", type: "warning" },
      { num: 137, text: "إِنْ هَٰذَا إِلَّا خُلُقُ الْأَوَّلِينَ", tafsir: "ما هذا الذي جئت به إلا عادة الأولين وأكاذيبهم.", type: "warning" },
      { num: 138, text: "وَمَا نَحْنُ بِمُعَذَّبِينَ", tafsir: "ولسنا بمعذبين كما تزعم وتدعي.", type: "warning" },
      { num: 139, text: "فَكَذَّبُوهُ فَأَهْلَكْنَاهُمْ ۗ إِنَّ فِي ذَٰلِك لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُم مُّؤْمِنِينَ", tafsir: "فكذبوا هوداً فأهلكناهم بالريح الصرصر العاتية. إن في ذلك عبرة وما كان أكثرهم مؤمنين.", type: "warning" },
      { num: 140, text: "وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ", tafsir: "وإن ربك لهو العزيز الرحيم.", type: "reassurance" },
      { num: 141, text: "كَذَّبَتْ ثَمُودُ الْمُرْسَلِينَ", tafsir: "كذبت ثمود نبيها صالحاً ورسالات الله.", type: "warning" },
      { num: 142, text: "إِذْ قَالَ لَهُمْ أَخُوهُمْ صَالِحٌ أَلَا تَتَّقُونَ", tafsir: "إذ قال لهم أخوهم صالح: ألا تتقون عذاب الله بترك عبادة الأصنام؟", type: "warning" },
      { num: 143, text: "إِنِّي لَكُمْ رَسُولٌ أَمِينٌ", tafsir: "إني لكم رسول أمين.", type: "warning" },
      { num: 144, text: "فَاتَّقُوا اللَّهَ وَأَطِيعُونِ", tafsir: "فاتقوا الله وأطيعون.", type: "warning" },
      { num: 145, text: "وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَىٰ رَبِّ الْعَالَمِينَ", tafsir: "وما أطلب منكم أجر مال، إن أجري إلا على رب العالمين.", type: "warning" },
      { num: 146, text: "أَتُتْرَكُونَ فِي مَا هَاهُنَا آمِنِينَ", tafsir: "أتظنون أنكم تتركون في نعم الدنيا آمنين بغير حساب ولا موت؟", type: "warning" },
      { num: 147, text: "فِي جَنَّاتٍ وَعُيُونٍ", tafsir: "في بساتين وزروع وعيون نابعة.", type: "warning" },
      { num: 148, text: "وَزُرُوعٍ وَنَخْلٍ طَلْعُهَا هَضِيمٌ", tafsir: "وزروع ونخيل ثمرها ناضج لطيف.", type: "warning" },
      { num: 149, text: "وَتَنحِتُونَ مِنَ الْجِبَالِ بُيُوتًا فَارِهِينَ", tafsir: "وتنحتون من الجبال بيوتاً فارهين ماهرين حَاذِقِين؟", type: "warning" },
      { num: 150, text: "فَاتَّقُوا اللَّهَ وَأَطِيعُونِ", tafsir: "فاتقوا الله وأطيعوني.", type: "warning" },
      { num: 151, text: "وَلَا تُطِيعُوا أَمْرَ الْمُسْرِفِينَ", tafsir: "ولا تطيعوا أمر المسرفين المتجاوزين لحدد الله.", type: "warning" },
      { num: 152, text: "الَّذِينَ يُفْسِدُونَ فِي الْأَرْضِ وَلَا يُصْلِحُونَ", tafsir: "الذين ينشرون الفساد في الأرض بالكفر والمعاصي ولا يصلحون.", type: "warning" },
      { num: 153, text: "قَالُوا إِنَّمَا أَنتَ مِنَ الْمُسَحَّرِينَ", tafsir: "قالوا له: إنما أنت ممن سُحروا مراراً حتى تغيَّر عقلك.", type: "warning" },
      { num: 154, text: "مَا أَنتَ إِلَّا بَشَرٌ مِّثْلُنَا فَأْتِ بِآيَةٍ إِن كُنتَ مِنَ الصَّادِقِينَ", tafsir: "ما أنت إلا بشر مثلنا، فأت بدليل ومعجزة إن كنت صادقاً.", type: "warning" },
      { num: 155, text: "قَالَ هَٰذِهِ نَاقَةٌ لَّهَا شِرْبٌ وَلَكُمْ شِرْبُ يَوْمٍ مَّعْلُومٍ", tafsir: "قال صالح: هذه الناقة آية، لها يوم تشرب فيه الماء ولكم يوم معلوم لشربكم.", type: "warning" },
      { num: 156, text: "وَلَا تَمَسُّوهَا بِسُوءٍ فَيَأْخُذَكُمْ عَذَابُ يَوْمٍ عَظِيمٍ", tafsir: "ولا تمسوها بضرر أو قتل فيصيبكم عذاب يوم عظيم العول.", type: "warning" },
      { num: 157, text: "فَعَقَرُوهَا فَأَصْبَحُوا نَادِمِينَ", tafsir: "فنحروا الناقة وقتلوها فأصبحوا نادمين حين تحققوا العذاب.", type: "warning" },
      { num: 158, text: "فَأَخَذَهُمُ الْعَذَابُ ۗ إِنَّ فِي ذَٰلِك لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُم مُّؤْمِنِينَ", tafsir: "فأخذتهم الصيحة والعذاب. إن في ذلك عبرة وما كان أكثرهم مؤمنين.", type: "warning" },
      { num: 159, text: "وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ", tafsir: "وإن ربك لهو العزيز الرحيم.", type: "reassurance" },
      { num: 160, text: "كَذَّبَتْ قَوْمُ لُوطٍ الْمُرْسَلِينَ", tafsir: "كذبت قوم لوط رسل الله بتكذيبهم لنبيهم لوط.", type: "purity" },
      { num: 161, text: "إِذْ قَالَ لَهُمْ أَخُوهُمْ لُوطٌ أَلَا تَتَّقُونَ", tafsir: "إذ قال لهم لوط: ألا تتقون الله وتتركون الفواحش؟", type: "purity" },
      { num: 162, text: "إِنِّي لَكُمْ رَسُولٌ أَمِينٌ", tafsir: "إني لكم رسول أمين.", type: "purity" },
      { num: 163, text: "فَاتَّقُوا اللَّهَ وَأَطِيعُونِ", tafsir: "فاتقوا الله وأطيعون.", type: "purity" },

      { num: 226, text: "وَأَنَّهُمْ يَقُولُونَ مَا لَا يَفْعَلُونَ", tafsir: "وأنهم يدعون ويقولون بألسنتهم ما لا يفعلون في واقعهم؟", type: "warning" },
      { num: 227, text: "إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَذَكَرُوا اللَّهَ كَثِيرًا وَانتَصَرُوا مِن بَعْدِ مَا ظُلِمُوا ۗ وَسَيَعْلَمُ الَّذِينَ ظَلَمُوا أَيَّ مُنقَلَبٍ يَنقَلِبُونَ", tafsir: "إلا الشعراء المؤمنين الصالحين الذين يذكرون الله كثيراً وينتصرون للحق والظلم، وسيعلم المشركون والظالمون أي مصير وعقاب سينقلبون إليه يوم القيامة.", type: "reassurance" }
    ];

    let currentIndex = 0;
    const totalVerses = quranData.length;

    // تهيئة الكانفاس
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animFrame;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }
    window.addEventListener('resize', resizeCanvas);

    function initParticles() {
      particles = [];
      const count = Math.floor((canvas.width * canvas.height) / 7500);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 0.8,
          alpha: Math.random() * 0.7 + 0.3,
          speedY: -(Math.random() * 0.3 + 0.1),
          speedX: (Math.random() - 0.5) * 0.2
        });
      }
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const currentType = quranData[currentIndex].type || 'reassurance';

      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;

        if (p.y < 0) p.y = canvas.height;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);

        if (currentType === 'peace' || currentType === 'purity') {
          ctx.fillStyle = `rgba(56, 211, 159, ${Math.abs(p.alpha)})`;
          ctx.shadowColor = '#38d39f';
        } else if (currentType === 'certainty' || currentType === 'miracle' || currentType === 'salvation') {
          ctx.fillStyle = `rgba(56, 189, 248, ${Math.abs(p.alpha)})`;
          ctx.shadowColor = '#38bdf8';
        } else if (currentType === 'warning') {
          ctx.fillStyle = `rgba(239, 68, 68, ${Math.abs(p.alpha)})`;
          ctx.shadowColor = '#ef4444';
        } else {
          ctx.fillStyle = `rgba(226, 184, 107, ${Math.abs(p.alpha)})`;
          ctx.shadowColor = '#e2b86b';
        }

        ctx.shadowBlur = 8;
        ctx.fill();
      });

      let grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, canvas.width * 0.65);
      if (currentType === 'peace' || currentType === 'purity') {
        grad.addColorStop(0, 'rgba(56, 211, 159, 0.18)');
        grad.addColorStop(1, 'rgba(2, 15, 24, 0)');
      } else if (currentType === 'certainty' || currentType === 'miracle') {
        grad.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
        grad.addColorStop(1, 'rgba(2, 15, 24, 0)');
      } else if (currentType === 'warning') {
        grad.addColorStop(0, 'rgba(239, 68, 68, 0.12)');
        grad.addColorStop(1, 'rgba(2, 15, 24, 0)');
      } else {
        grad.addColorStop(0, 'rgba(226, 184, 107, 0.18)');
        grad.addColorStop(1, 'rgba(2, 15, 24, 0)');
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      animFrame = requestAnimationFrame(renderCanvas);
    }

    // التحديث والتفاعل
    function renderVerse(index) {
      if (index < 0) index = 0;
      if (index >= totalVerses) index = totalVerses - 1;

      currentIndex = index;
      const data = quranData[currentIndex];

      const textElem = document.getElementById('quranText');
      const tafsirElem = document.getElementById('verseMeaning');
      const badgeElem = document.getElementById('verseNumBadge');
      const inputElem = document.getElementById('verseInput');

      textElem.classList.remove('active');
      tafsirElem.classList.remove('active');

      setTimeout(() => {
        textElem.innerText = `﴿ ${data.text} ﴾`;
        tafsirElem.innerText = data.tafsir;
        badgeElem.innerText = `الآية ${data.num} من ${totalVerses}`;
        inputElem.value = data.num;

        textElem.classList.add('active');
        tafsirElem.classList.add('active');
      }, 200);

      // تحديث ملف الصوت
      updateAudioTrack(data.num);
    }

    // إعداد مشغل الصوت لكل آية تلقائياً من سيرفر EveryAyah المعتمد
    const audioPlayer = document.getElementById('quranAudio');
    let isPlaying = false;

    function updateAudioTrack(verseNum) {
      // استخدام تلاوة الشيخ العفاسي برابط مباشر وموثوق لكل آية في سورة الشعراء (رقم السورة 026)
      const formattedVerse = String(verseNum).padStart(3, '0');
      const audioUrl = `https://everyayah.com/data/Alafasy_128kbps/026${formattedVerse}.mp3`;
      
      const wasPlaying = isPlaying;
      audioPlayer.src = audioUrl;
      if (wasPlaying) {
        audioPlayer.play().catch(() => {});
      }
    }

    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audioPlayer.pause();
        playBtn.innerText = "▶";
      } else {
        audioPlayer.play().then(() => {
          playBtn.innerText = "⏸";
        }).catch(() => {
          alert("تعذر تشغيل الصوت، جاري الاتصال بالشبكة...");
        });
      }
      isPlaying = !isPlaying;
    });

    audioPlayer.addEventListener('ended', () => {
      if (currentIndex < totalVerses - 1) {
        renderVerse(currentIndex + 1);
        audioPlayer.play();
      } else {
        isPlaying = false;
        playBtn.innerText = "▶";
      }
    });

    // التنقل بالآيات
    document.getElementById('nextBtn').addEventListener('click', () => renderVerse(currentIndex + 1));
    document.getElementById('prevBtn').addEventListener('click', () => renderVerse(currentIndex - 1));

    document.getElementById('verseInput').addEventListener('change', (e) => {
      const val = parseInt(e.target.value);
      if (val >= 1 && val <= totalVerses) {
        renderVerse(val - 1);
      }
    });

    document.getElementById('storySelect').addEventListener('change', (e) => {
      const targetVerse = parseInt(e.target.value);
      renderVerse(targetVerse - 1);
    });

    // الكيبورد والعجلة
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('tafsirModal').classList.contains('open')) return;
      if (e.key === 'ArrowLeft') renderVerse(currentIndex + 1);
      if (e.key === 'ArrowRight') renderVerse(currentIndex - 1);
      if (e.key === ' ') {
        e.preventDefault();
        playBtn.click();
      }
    });

    // بناء قائمة التفسير مع خاصية البحث
    function buildTafsirModalList(filter = '') {
      const container = document.getElementById('tafsirListContainer');
      container.innerHTML = '';

      quranData.forEach((item, idx) => {
        if (filter && !item.text.includes(filter) && !item.tafsir.includes(filter) && !item.num.toString().includes(filter)) {
          return;
        }

        const div = document.createElement('div');
        div.className = 'tafsir-item';
        div.innerHTML = `
          <strong>الآية (${item.num}): ﴿${item.text}﴾</strong>
          <p>${item.tafsir}</p>
        `;
        div.addEventListener('click', () => {
          renderVerse(idx);
          document.getElementById('tafsirModal').classList.remove('open');
        });
        container.appendChild(div);
      });
    }

    // نافذة الفهرس
    const modal = document.getElementById('tafsirModal');
    document.getElementById('tafsirBtn').addEventListener('click', () => {
      buildTafsirModalList();
      modal.classList.add('open');
    });

    document.getElementById('closeTafsir').addEventListener('click', () => modal.classList.remove('open'));

    document.getElementById('searchInput').addEventListener('input', (e) => {
      buildTafsirModalList(e.target.value.trim());
    });

    // البدء والتشغيل الأول
    resizeCanvas();
    renderVerse(0);
    renderCanvas();
  </script>
</body>
</html>
